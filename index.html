<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminous Inflorescence</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f1a 100%);
            min-height: 100vh;
            color: var(--anthropic-light);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(20, 20, 30, 0.92);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: #faf9f5;
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: #8a8a90;
            font-size: 13px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: #e8e6dc;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            color: #e8e6dc;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.15);
            background: rgba(255, 255, 255, 0.1);
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #e8e6dc;
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #8a8a90;
            min-width: 50px;
            text-align: right;
        }

        .color-group {
            margin-bottom: 14px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: #8a8a90;
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #8a8a90;
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background: #0a0a0f;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 600px;
            font-size: 16px;
            color: #8a8a90;
            font-family: 'Lora', serif;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Luminous Inflorescence</h1>
            <div class="subtitle">算法花圃 · 每次播种都生长出一座独一无二的发光花园</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>种子</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← 上一个</button>
                    <button class="button secondary" onclick="nextSeed()">下一个 →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ 随机</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>参数</h3>

                <div class="control-group">
                    <label>花朵数量</label>
                    <div class="slider-container">
                        <input type="range" id="bloomCount" min="2" max="10" step="1" value="5" oninput="updateParam('bloomCount', parseInt(this.value))">
                        <span class="value-display" id="bloomCount-value">5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>每朵花粒子数</label>
                    <div class="slider-container">
                        <input type="range" id="particlesPerBloom" min="500" max="4000" step="250" value="1500" oninput="updateParam('particlesPerBloom', parseInt(this.value))">
                        <span class="value-display" id="particlesPerBloom-value">1500</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>噪声强度</label>
                    <div class="slider-container">
                        <input type="range" id="noiseMagnitude" min="0.5" max="8.0" step="0.5" value="3.0" oninput="updateParam('noiseMagnitude', parseFloat(this.value))">
                        <span class="value-display" id="noiseMagnitude-value">3.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>噪声尺度</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.02" step="0.001" value="0.004" oninput="updateParam('noiseScale', parseFloat(this.value))">
                        <span class="value-display" id="noiseScale-value">0.004</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>螺旋卷曲度</label>
                    <div class="slider-container">
                        <input type="range" id="spiralRate" min="0.2" max="2.5" step="0.1" value="0.6" oninput="updateParam('spiralRate', parseFloat(this.value))">
                        <span class="value-display" id="spiralRate-value">0.6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>花朵半径</label>
                    <div class="slider-container">
                        <input type="range" id="bloomRadius" min="150" max="500" step="25" value="350" oninput="updateParam('bloomRadius', parseInt(this.value))">
                        <span class="value-display" id="bloomRadius-value">350</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>颜色</h3>

                <div class="color-group">
                    <label>花色 1</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#ff6b6b" onchange="updateColor(0, this.value)">
                        <span class="color-value" id="color1-value">#ff6b6b</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>花色 2</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#4ecdc4" onchange="updateColor(1, this.value)">
                        <span class="color-value" id="color2-value">#4ecdc4</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>花色 3</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#ffe66d" onchange="updateColor(2, this.value)">
                        <span class="color-value" id="color3-value">#ffe66d</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>花色 4</label>
                    <div class="color-picker-container">
                        <input type="color" id="color4" value="#a29bfe" onchange="updateColor(3, this.value)">
                        <span class="color-value" id="color4-value">#a29bfe</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>操作</h3>
                <div class="button-row">
                    <button class="button" onclick="regenerate()">↻ 重播</button>
                    <button class="button secondary" onclick="resetParameters()">重置</button>
                </div>
                <button class="button tertiary" onclick="downloadPNG()" style="margin-top: 8px;">⬇ 下载 PNG</button>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">培育花朵中...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════
        let params = {
            seed: 12345,
            bloomCount: 5,
            particlesPerBloom: 1500,
            noiseMagnitude: 3.0,
            noiseScale: 0.004,
            spiralRate: 0.6,
            bloomRadius: 350,
            bloomHues: [4, 176, 52, 248]
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        // ═══════════════════════════════════════════════════════════════════════
        // SYSTEM STATE
        // ═══════════════════════════════════════════════════════════════════════
        let blooms = [];
        let particles = [];
        let frameCount = 0;
        const MAX_FRAMES = 200;
        let animationComplete = false;

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS SETUP
        // ═══════════════════════════════════════════════════════════════════════
        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            colorMode(HSB, 360, 100, 100, 100);
            noiseDetail(3, 0.55);
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            blooms = [];
            particles = [];
            frameCount = 0;
            animationComplete = false;

            // Create bloom centers with minimum-distance rejection sampling
            for (let i = 0; i < params.bloomCount; i++) {
                let cx, cy, valid;
                let attempts = 0;
                let margin = params.bloomRadius * 0.5;
                do {
                    cx = random(margin, width - margin);
                    cy = random(margin, height - margin);
                    valid = true;
                    for (let b of blooms) {
                        if (dist(cx, cy, b.x, b.y) < params.bloomRadius * 0.55) {
                            valid = false;
                            break;
                        }
                    }
                    attempts++;
                } while (!valid && attempts < 60);

                let petalCount = floor(random(5, 11));
                blooms.push({
                    x: cx,
                    y: cy,
                    hue: params.bloomHues[i % params.bloomHues.length],
                    radius: params.bloomRadius,
                    count: params.particlesPerBloom,
                    petals: petalCount
                });
            }

            // Create particles distributed among blooms
            for (let bloom of blooms) {
                for (let i = 0; i < bloom.count; i++) {
                    particles.push(new Particle(bloom, i));
                }
            }

            // Dark background
            background(0, 0, 5);
            loop();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // PARTICLE CLASS
        // ═══════════════════════════════════════════════════════════════════════
        class Particle {
            constructor(bloom, index) {
                this.bx = bloom.x;
                this.by = bloom.y;
                this.baseHue = bloom.hue;
                this.maxDist = bloom.radius;
                this.speed = random(0.6, 2.8);

                // Distribute into petal clusters using Gaussian around evenly-spaced angles
                let petalSpan = TWO_PI / bloom.petals;
                let petalIdx = index % bloom.petals;
                let centerAngle = petalIdx * petalSpan + petalSpan * 0.5;
                let spread = petalSpan * 0.35;
                this.initialAngle = centerAngle + randomGaussian() * spread;

                // Wrap angle to [0, TWO_PI]
                while (this.initialAngle < 0) this.initialAngle += TWO_PI;
                while (this.initialAngle > TWO_PI) this.initialAngle -= TWO_PI;

                this.angle = this.initialAngle;
                this.dist = random(0, 4);
                this.alive = true;
                this.prevX = this.bx + cos(this.angle) * max(0, this.dist - this.speed);
                this.prevY = this.by + sin(this.angle) * max(0, this.dist - this.speed);
            }

            update() {
                if (!this.alive) return;

                // Store previous position before advancing
                this.prevX = this.bx + cos(this.angle) * this.dist;
                this.prevY = this.by + sin(this.angle) * this.dist;

                this.dist += this.speed;
                if (this.dist >= this.maxDist) {
                    this.alive = false;
                    return;
                }

                let cx = this.bx + cos(this.angle) * this.dist;
                let cy = this.by + sin(this.angle) * this.dist;

                // Sample Perlin noise at current position for organic perturbation
                let n = noise(cx * params.noiseScale, cy * params.noiseScale);
                let perturbation = map(n, 0.3, 0.7, -params.noiseMagnitude, params.noiseMagnitude);
                this.angle += perturbation * 0.025;

                // Spiral twist — stronger near center, gentler at edges
                let spiralFactor = 1.0 - (this.dist / this.maxDist) * 0.65;
                this.angle += params.spiralRate * 0.018 * spiralFactor;
            }

            display() {
                if (!this.alive || this.dist < 0.3) return;

                let cx = this.bx + cos(this.angle) * this.dist;
                let cy = this.by + sin(this.angle) * this.dist;

                // Hue shifts with distance and angular position
                let hueShift = map(this.dist, 0, this.maxDist, 0, 28);
                let hueVar = sin(this.initialAngle * 3.5) * 6;
                let h = (this.baseHue + hueShift + hueVar + 360) % 360;

                // Saturation & brightness: vibrant near center, softer at edges
                let distRatio = this.dist / this.maxDist;
                let sat = map(distRatio, 0, 0.9, 100, 65);
                let bri = map(distRatio, 0, 0.8, 95, 50);

                // Alpha falloff near the edge for soft bloom boundaries
                let alphaFade = 1.0;
                if (distRatio > 0.65) {
                    alphaFade = map(distRatio, 0.65, 1.0, 1.0, 0.15);
                }
                let trailAlpha = 6.5;
                let alpha = trailAlpha * alphaFade;

                strokeWeight(1.1);
                stroke(h, sat, bri, alpha);
                line(this.prevX, this.prevY, cx, cy);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS DRAW LOOP
        // ═══════════════════════════════════════════════════════════════════════
        function draw() {
            // Very subtle fade for gentle depth and motion trails
            noStroke();
            fill(0, 0, 5, 1.8);
            rect(0, 0, width, height);

            let aliveCount = 0;
            for (let p of particles) {
                p.update();
                p.display();
                if (p.alive) aliveCount++;
            }

            frameCount++;

            // When animation completes or all particles are dead
            if (frameCount >= MAX_FRAMES || (aliveCount === 0 && frameCount > 10)) {
                if (!animationComplete) {
                    animationComplete = true;
                    drawCoreGlow();
                }
                noLoop();
            }
        }

        function drawCoreGlow() {
            // Add luminous cores at each bloom center
            for (let bloom of blooms) {
                for (let i = 0; i < 60; i++) {
                    let angle = random(TWO_PI);
                    let d = pow(random(1), 1.5) * bloom.radius * 0.12;
                    let x = bloom.x + cos(angle) * d;
                    let y = bloom.y + sin(angle) * d;
                    let distRatio = d / (bloom.radius * 0.12);
                    let alpha = map(distRatio, 0, 1, 70, 8);
                    let h = (bloom.hue + random(-5, 5) + 360) % 360;
                    stroke(h, 20, 100, alpha);
                    strokeWeight(random(1, 3.5));
                    point(x, y);
                }
                // A few bright center points
                for (let i = 0; i < 12; i++) {
                    let angle = random(TWO_PI);
                    let d = random(0, bloom.radius * 0.04);
                    let x = bloom.x + cos(angle) * d;
                    let y = bloom.y + sin(angle) * d;
                    stroke(bloom.hue, 10, 100, random(50, 90));
                    strokeWeight(random(2, 5));
                    point(x, y);
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI HANDLERS
        // ═══════════════════════════════════════════════════════════════════════
        function updateParam(paramName, value) {
            params[paramName] = value;
            let displayId = paramName + '-value';
            let el = document.getElementById(displayId);
            if (el) el.textContent = value;
            initializeSystem();
        }

        function updateColor(index, hexValue) {
            params.bloomHues[index] = hexToHue(hexValue);
            document.getElementById('color' + (index + 1) + '-value').textContent = hexValue;
            initializeSystem();
        }

        function hexToHue(hex) {
            let r = parseInt(hex.slice(1, 3), 16) / 255;
            let g = parseInt(hex.slice(3, 5), 16) / 255;
            let b = parseInt(hex.slice(5, 7), 16) / 255;
            let max = Math.max(r, g, b);
            let min = Math.min(r, g, b);
            if (max === min) return 0;
            let d = max - min;
            let h;
            if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
            else if (max === g) h = ((b - r) / d + 2) * 60;
            else h = ((r - g) / d + 4) * 60;
            return Math.round(h);
        }

        function regenerate() {
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('luminous-inflorescence-' + params.seed, 'png');
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROLS
        // ═══════════════════════════════════════════════════════════════════════
        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));

            // Update UI sliders
            document.getElementById('bloomCount').value = params.bloomCount;
            document.getElementById('bloomCount-value').textContent = params.bloomCount;
            document.getElementById('particlesPerBloom').value = params.particlesPerBloom;
            document.getElementById('particlesPerBloom-value').textContent = params.particlesPerBloom;
            document.getElementById('noiseMagnitude').value = params.noiseMagnitude;
            document.getElementById('noiseMagnitude-value').textContent = params.noiseMagnitude;
            document.getElementById('noiseScale').value = params.noiseScale;
            document.getElementById('noiseScale-value').textContent = params.noiseScale;
            document.getElementById('spiralRate').value = params.spiralRate;
            document.getElementById('spiralRate-value').textContent = params.spiralRate;
            document.getElementById('bloomRadius').value = params.bloomRadius;
            document.getElementById('bloomRadius-value').textContent = params.bloomRadius;

            // Reset colors
            let defaultHexes = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a29bfe'];
            let defaultHues = [4, 176, 52, 248];
            for (let i = 0; i < 4; i++) {
                document.getElementById('color' + (i + 1)).value = defaultHexes[i];
                document.getElementById('color' + (i + 1) + '-value').textContent = defaultHexes[i];
            }
            params.bloomHues = [...defaultHues];

            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
