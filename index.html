<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子画</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #0f0f18; --panel: rgba(15,15,28,0.95); --text: #e8e6dc; --muted: #8a8a90; --orange: #d97757; --blue: #6a9bcc; --green: #788c5d; --border: rgba(255,255,255,0.06); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); min-height: 100vh; color: var(--text); }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 320px; flex-shrink: 0; background: var(--panel); backdrop-filter: blur(10px); padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow-y: auto; overflow-x: hidden; border: 1px solid var(--border); }
        .sidebar h2 { font-family: 'Lora', serif; font-size: 22px; font-weight: 500; color: #faf9f5; margin-bottom: 4px; }
        .sidebar .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 24px; }
        .ctrl { margin-bottom: 24px; }
        .ctrl h3 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .ctrl h3::before { content: '•'; color: var(--orange); font-weight: bold; }
        .row { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
        .row label { font-size: 13px; color: var(--muted); white-space: nowrap; }
        .row input[type="range"] { flex: 1; height: 4px; background: rgba(255,255,255,0.12); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--orange); border-radius: 50%; cursor: pointer; }
        .val { font-family: 'Courier New', monospace; font-size: 11px; color: var(--muted); min-width: 32px; text-align: right; }
        .btn { background: var(--orange); color: #fff; border: none; padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; width: 100%; }
        .btn:hover { background: #c86641; transform: translateY(-1px); }
        .btn.b2 { background: var(--blue); } .btn.b2:hover { background: #5a8bb8; }
        .btn.b3 { background: var(--green); } .btn.b3:hover { background: #6b7b52; }
        .btn.sm { padding: 6px 10px; font-size: 12px; }
        .btn-row { display: flex; gap: 6px; } .btn-row .btn { flex: 1; }
        .upload-zone { border: 2px dashed rgba(255,255,255,0.15); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 8px; }
        .upload-zone:hover { border-color: var(--orange); background: rgba(217,119,87,0.05); }
        .upload-zone.has-img { border-style: solid; border-color: var(--green); padding: 8px; }
        .upload-zone img { max-width: 100%; max-height: 120px; border-radius: 4px; }
        .upload-zone .hint { font-size: 13px; color: var(--muted); }
        .upload-zone input { display: none; }
        .seed-row { display: flex; gap: 6px; }
        .seed-row input { flex: 1; background: rgba(255,255,255,0.06); padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); text-align: center; color: var(--text); font-family: 'Courier New', monospace; font-size: 14px; }
        .seed-row input:focus { outline: none; border-color: var(--orange); }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #cv { width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.6); background: #06060d; }
        #cv canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; height: 600px; font-size: 15px; color: var(--muted); font-family: 'Lora', serif; }
        @media (max-width: 600px) { .container { flex-direction: column; } .sidebar { width: 100%; } }
    </style>
</head>
<body>
<div class="container">
<div class="sidebar">
    <h2>粒子画</h2>
    <div class="subtitle">上传图片 → 生成粒子艺术品</div>

    <div class="ctrl">
        <h3>上传图片</h3>
        <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileIn').click()">
            <img id="preview" style="display:none">
            <span class="hint" id="hint">📁 点击选择图片<br><small>或拖拽图片到这里</small></span>
            <input type="file" id="fileIn" accept="image/*" onchange="handleFile(this.files[0])">
        </div>
        <button class="btn sm b2" onclick="clearImage()" style="margin-top:4px;">清除图片，用默认流场</button>
    </div>

    <div class="ctrl">
        <h3>种子</h3>
        <div class="seed-row">
            <input type="number" id="seedIn" value="12345" onchange="updateSeed()">
        </div>
        <div class="btn-row" style="margin-top:6px;">
            <button class="btn sm b2" onclick="prevSeed()">← 上一个</button>
            <button class="btn sm b2" onclick="nextSeed()">下一个 →</button>
            <button class="btn sm b3" onclick="randSeed()">↻ 随机</button>
        </div>
    </div>

    <div class="ctrl">
        <h3>参数</h3>
        <div class="row">
            <label>粒子密度</label>
            <input type="range" id="density" min="1" max="10" step="1" value="6" oninput="up('density',this.value)">
            <span class="val" id="density-v">6</span>
        </div>
        <div class="row">
            <label>粒子大小</label>
            <input type="range" id="pSize" min="1" max="8" step="0.5" value="2.5" oninput="up('pSize',this.value)">
            <span class="val" id="pSize-v">2.5</span>
        </div>
        <div class="row">
            <label>晃动幅度</label>
            <input type="range" id="drift" min="0" max="5" step="0.5" value="1" oninput="up('drift',this.value)">
            <span class="val" id="drift-v">1.5</span>
        </div>
        <div class="row">
            <label>亮度阈值</label>
            <input type="range" id="thresh" min="10" max="200" step="5" value="40" oninput="up('thresh',this.value)">
            <span class="val" id="thresh-v">40</span>
        </div>
    </div>

    <div class="ctrl">
        <h3>操作</h3>
        <div class="btn-row">
            <button class="btn" onclick="regen()">↻ 重播</button>
            <button class="btn b2" onclick="reset()">重置</button>
        </div>
        <button class="btn b3" onclick="saveCanvas('particle-art-'+params.seed,'png')" style="margin-top:6px;">⬇ 下载 PNG</button>
    </div>
</div>

<div class="canvas-area">
    <div id="cv"><div class="loading">请上传一张图片，或等待默认流场生成...</div></div>
</div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
let params = { seed:12345, density:6, pSize:2.5, drift:1, thresh:40 };
const defs = JSON.parse(JSON.stringify(params));
let uploadedImg = false;
let storedDataUrl = null;
let particles = [];
let frame = 0;
const MAX_FR = 300;
let done = false;
let cx, cy;
let hasImage = false; // true = 图片粒子模式

// ══════════════════════════════════════════════════════════════════
function setup() {
    let c = createCanvas(1200, 1200, WEBGL);
    c.parent('cv');
    colorMode(HSB, 360, 100, 100, 100);
    noiseDetail(4, 0.55);
    cx = width/2; cy = height/2;
    ortho();
    translate(-width/2, -height/2);
    document.querySelector('.loading').style.display = 'none';
    initFlowField();
}

// ── 默认流场 ──
let flowField = [], cols, rows;
const RES = 5;

function initFlowField() {
    randomSeed(params.seed); noiseSeed(params.seed);
    cols = floor(width/RES); rows = floor(height/RES);
    flowField = new Array(rows);
    for (let y=0; y<rows; y++) {
        flowField[y] = new Array(cols);
        for (let x=0; x<cols; x++) {
            let a = noise(x*RES*0.003, y*RES*0.003)*TWO_PI*3 + noise(x*RES*0.003+100, y*RES*0.003+100)*0.8;
            flowField[y][x] = p5.Vector.fromAngle(a);
        }
    }
    particles = [];
    for (let i=0; i<3500; i++) {
        let a = random(TWO_PI), r = random(0,60);
        particles.push({ x:cx+cos(a)*r, y:cy+sin(a)*r, px:cx+cos(a)*r, py:cy+sin(a)*r, md:random(200,540), sp:random(0.4,2.2), alive:true, src:'flow' });
    }
    hasImage = false;
    background(6,6,13); frame=0; done=false; loop();
}

// ── 图片粒子 ──
function processImage() {
    if (!storedDataUrl) { initFlowField(); return; }
    let imgEl = new Image();
    imgEl.src = storedDataUrl;
    if (!imgEl.complete || imgEl.naturalWidth === 0) {
        imgEl.onload = () => processImageCore(imgEl);
        return;
    }
    processImageCore(imgEl);
}

function processImageCore(imgEl) {
    randomSeed(params.seed); noiseSeed(params.seed);

    let iw = imgEl.naturalWidth || imgEl.width;
    let ih = imgEl.naturalHeight || imgEl.height;
    let scale = max(width/iw, height/ih);
    let sw = floor(iw*scale), sh = floor(ih*scale);
    let ox = (width-sw)/2, oy = (height-sh)/2;

    // 原生 Canvas 读像素
    let c = document.createElement('canvas');
    c.width = sw; c.height = sh;
    let ctx = c.getContext('2d');
    ctx.drawImage(imgEl, 0, 0, sw, sh);
    let data = ctx.getImageData(0, 0, sw, sh).data;

    let step = max(2, 12 - params.density); // 密度越高 → 步长越小 → 粒子越多
    particles = [];

    for (let y=0; y<sh; y+=step) {
        for (let x=0; x<sw; x+=step) {
            let idx = (y*sw + x)*4;
            let rr = data[idx], gg = data[idx+1], bb = data[idx+2], aa = data[idx+3];
            let bright = (rr+gg+bb)/3;
            if (bright >= params.thresh && aa > 20) {
                let px = ox + x;
                let py = oy + y;
                if (px < 0 || px >= width || py < 0 || py >= height) continue;
                let count = bright > 200 ? 3 : bright > 140 ? 2 : 1;
                for (let n=0; n<count; n++) {
                    particles.push({
                        x: px + random(-step/2, step/2),
                        y: py + random(-step/2, step/2),
                        ox: px, oy: py,
                        r: rr, g: gg, b: bb,
                        bright: bright,
                        alive: true, src: 'img',
                        ph: random(TWO_PI), fx: random(0.7,1.3), fy: random(0.7,1.3),
                    });
                }
            }
        }
    }
    hasImage = true;
    background(6,6,13);
    frame=0; done=false;

    // 静态模式直接一帧搞定
    if (params.drift === 0) {
        renderImageParticlesStatic();
        noLoop();
        done = true;
    } else {
        loop();
    }
}

// ── 静态渲染：一次画出所有粒子，不走 draw 循环 ──
function renderImageParticlesStatic() {
    colorMode(RGB, 255, 255, 255, 255);
    noStroke();
    let ps = params.pSize, half = ps/2;
    let thresh = params.thresh;
    beginShape(QUADS);
    for (let p of particles) {
        if (!p.alive) continue;
        let a = map(p.bright, thresh, 255, 0.15, 0.85)*255;
        fill(p.r&0xF0, p.g&0xF0, p.b&0xF0, Math.round(a/16)*16);
        vertex(p.x-half, p.y-half);
        vertex(p.x+half, p.y-half);
        vertex(p.x+half, p.y+half);
        vertex(p.x-half, p.y+half);
    }
    endShape();
}

// ══════════════════════════════════════════════════════════════════
function draw() {
    resetMatrix();
    ortho();
    translate(-width/2, -height/2);
    if (hasImage) {
        drawImageParticles();
    } else {
        drawFlowField();
    }
}

// ── 图片粒子 draw（晃动模式） ──
function drawImageParticles() {
    colorMode(RGB, 255, 255, 255, 255);
    noStroke();
    let ps = params.pSize, half = ps/2;
    let thresh = params.thresh, drift = params.drift;

    // 背景淡出
    fill(6, 6, 13, 18);
    rect(0, 0, width, height);

    // 批处理：所有粒子打包成一个 beginShape(QUADS)，GPU 一次渲染
    beginShape(QUADS);
    for (let p of particles) {
        if (!p.alive) continue;

        if (drift > 0) {
            let t = frame * 0.04;
            p.x = p.ox + sin(t * p.fx + p.ph) * drift * 3.5;
            p.y = p.oy + cos(t * p.fy + p.ph) * drift * 3.5;
        }

        let a = map(p.bright, thresh, 255, 0.12, 0.75)*255;
        // 颜色量化到近 16，合并相近粒子减少 GPU 调用
        fill(p.r&0xF0, p.g&0xF0, p.b&0xF0, Math.round(a/16)*16);
        vertex(p.x-half, p.y-half);
        vertex(p.x+half, p.y-half);
        vertex(p.x+half, p.y+half);
        vertex(p.x-half, p.y+half);
    }
    endShape();

    frame++;
    if (frame>=MAX_FR) { done=true; noLoop(); }
}

// ── 默认流场 draw ──
function drawFlowField() {
    colorMode(HSB, 360, 100, 100, 100);
    noStroke(); fill(6,6,13, 8); rect(0,0,width,height);

    let alive = 0;
    for (let p of particles) {
        if (!p.alive) continue;
        alive++;
        let col = constrain(floor(p.x/RES),0,cols-1);
        let row = constrain(floor(p.y/RES),0,rows-1);
        let fl = flowField[row][col];
        p.px=p.x; p.py=p.y;
        p.x+=fl.x*1.2; p.y+=fl.y*1.2;
        let d = dist(cx,cy,p.x,p.y);
        if (d>p.md||p.x<-20||p.x>width+20||p.y<-20||p.y>height+20) { p.alive=false; continue; }
        let dr = constrain(d/p.md,0,1);
        let ang = atan2(p.y-cy,p.x-cx);
        let h = map(ang,-PI,PI,0,360);
        stroke(h,85,95, 10*(1-dr*0.6));
        strokeWeight(map(dr,0,1,1.5,0.6));
        line(p.px,p.py,p.x,p.y);
    }
    frame++;
    if (frame>=MAX_FR || (alive===0 && frame>10)) { done=true; noLoop(); }
}

// ══════════════════════════════════════════════════════════════════
// UI
function up(k, v) {
    params[k] = (k==='density') ? parseInt(v) : parseFloat(v);
    document.getElementById(k+'-v').textContent = v;
    if (uploadedImg) processImage(); else initFlowField();
}
function handleFile(file) {
    if (!file) return;
    let reader = new FileReader();
    reader.onload = function(e) {
        storedDataUrl = e.target.result;
        uploadedImg = true;
        document.getElementById('preview').src = e.target.result;
        document.getElementById('preview').style.display = 'block';
        document.getElementById('hint').style.display = 'none';
        document.getElementById('dropZone').classList.add('has-img');
        processImage();
    };
    reader.readAsDataURL(file);
}
function clearImage() {
    uploadedImg = false;
    storedDataUrl = null;
    hasImage = false;
    document.getElementById('preview').style.display = 'none';
    document.getElementById('hint').style.display = '';
    document.getElementById('dropZone').classList.remove('has-img');
    document.getElementById('fileIn').value = '';
    initFlowField();
}
function regen() {
    if (uploadedImg) processImage(); else initFlowField();
}
function reset() {
    params = JSON.parse(JSON.stringify(defs));
    ['density','pSize','drift','thresh'].forEach(k=>{
        document.getElementById(k).value=params[k];
        document.getElementById(k+'-v').textContent=params[k];
    });
    updateSeedDisp();
    if (uploadedImg) processImage(); else initFlowField();
}
function updateSeedDisp() { document.getElementById('seedIn').value = params.seed; }
function updateSeed() { let v=parseInt(document.getElementById('seedIn').value); if(v&&v>0){params.seed=v;regen();}else updateSeedDisp(); }
function prevSeed() { params.seed=Math.max(1,params.seed-1); updateSeedDisp(); regen(); }
function nextSeed() { params.seed++; updateSeedDisp(); regen(); }
function randSeed() { params.seed=floor(Math.random()*999999)+1; updateSeedDisp(); regen(); }
window.addEventListener('load',()=>updateSeedDisp());

// 拖拽
document.addEventListener('DOMContentLoaded',()=>{
    let dz = document.getElementById('dropZone');
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderColor='var(--orange)';});
    dz.addEventListener('dragleave',()=>dz.style.borderColor='');
    dz.addEventListener('drop',e=>{
        e.preventDefault(); dz.style.borderColor='';
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
});
</script>
</body>
</html>
