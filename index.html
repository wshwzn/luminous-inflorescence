<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子画</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js">
    </script>
    <style>
        :root { --dark: #0f0f18; --panel: rgba(15,15,28,0.95); --text: #e8e6dc; --muted: #8a8a90; --orange: #d97757; --blue: #6a9bcc; --green: #788c5d; --border: rgba(255,255,255,0.06); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); min-height: 100vh; color: var(--text); }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 320px; flex-shrink: 0; background: var(--panel); backdrop-filter: blur(10px); padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow-y: auto; overflow-x: hidden; border: 1px solid var(--border); }
        .sidebar h2 { font-family: 'Lora', serif; font-size: 22px; font-weight: 500; color: #faf9f5; margin-bottom: 4px; }
        .sidebar .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 24px; }
        .ctrl { margin-bottom: 24px; }
        .ctrl h3 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .ctrl h3::before { content: '•'; color: var(--orange); font-weight: bold; }
        .row { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
        .row label { font-size: 13px; color: var(--muted); white-space: nowrap; }
        .row input[type="range"] { flex: 1; height: 4px; background: rgba(255,255,255,0.12); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--orange); border-radius: 50%; cursor: pointer; }
        .val { font-family: 'Courier New', monospace; font-size: 11px; color: var(--muted); min-width: 32px; text-align: right; }
        .btn { background: var(--orange); color: #fff; border: none; padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; width: 100%; }
        .btn:hover { background: #c86641; transform: translateY(-1px); }
        .btn.b2 { background: var(--blue); } .btn.b2:hover { background: #5a8bb8; }
        .btn.b3 { background: var(--green); } .btn.b3:hover { background: #6b7b52; }
        .btn.sm { padding: 6px 10px; font-size: 12px; }
        .btn-row { display: flex; gap: 6px; } .btn-row .btn { flex: 1; }
        .upload-zone { border: 2px dashed rgba(255,255,255,0.15); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 8px; }
        .upload-zone:hover { border-color: var(--orange); background: rgba(217,119,87,0.05); }
        .upload-zone.has-img { border-style: solid; border-color: var(--green); padding: 8px; }
        .upload-zone img { max-width: 100%; max-height: 120px; border-radius: 4px; }
        .upload-zone .hint { font-size: 13px; color: var(--muted); }
        .upload-zone input { display: none; }
        .seed-row { display: flex; gap: 6px; }
        .seed-row input { flex: 1; background: rgba(255,255,255,0.06); padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); text-align: center; color: var(--text); font-family: 'Courier New', monospace; font-size: 14px; }
        .seed-row input:focus { outline: none; border-color: var(--orange); }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; position: relative; }
        #canvas-wrap { position: relative; width: 100%; max-width: 1000px; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.6); background: #06060d; }
        #canvas-wrap canvas { position: absolute; top: 0; left: 0; display: block; width: 100% !important; height: 100% !important; }
        .loading { display: flex; align-items: center; justify-content: center; height: 600px; font-size: 15px; color: var(--muted); font-family: 'Lora', serif; }
        @media (max-width: 600px) { .container { flex-direction: column; } .sidebar { width: 100%; } }
    </style>
</head>
<body>
<div class="container">
<div class="sidebar">
    <h2>粒子画</h2>
    <div class="subtitle">上传图片 → 生成粒子艺术品</div>

    <div class="ctrl">
        <h3>上传图片</h3>
        <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileIn').click()">
            <img id="preview" style="display:none">
            <span class="hint" id="hint">📁 点击选择图片<br><small>或拖拽图片到这里</small></span>
            <input type="file" id="fileIn" accept="image/*" onchange="handleFile(this.files[0])">
        </div>
        <button class="btn sm b2" onclick="clearImage()" style="margin-top:4px;">清除图片，用默认流场</button>
    </div>

    <div class="ctrl">
        <h3>种子</h3>
        <div class="seed-row"><input type="number" id="seedIn" value="12345" onchange="updateSeed()"></div>
        <div class="btn-row" style="margin-top:6px;">
            <button class="btn sm b2" onclick="prevSeed()">← 上一个</button>
            <button class="btn sm b2" onclick="nextSeed()">下一个 →</button>
            <button class="btn sm b3" onclick="randSeed()">↻ 随机</button>
        </div>
    </div>

    <div class="ctrl">
        <h3>参数</h3>
        <div class="row"><label>粒子密度</label><input type="range" id="density" min="1" max="10" step="1" value="6" oninput="up('density',this.value)"><span class="val" id="density-v">6</span></div>
        <div class="row"><label>粒子大小</label><input type="range" id="pSize" min="1" max="8" step="0.5" value="2.5" oninput="up('pSize',this.value)"><span class="val" id="pSize-v">2.5</span></div>
        <div class="row"><label>晃动幅度</label><input type="range" id="drift" min="0" max="2" step="0.1" value="1" oninput="up('drift',this.value)"><span class="val" id="drift-v">1</span></div>
        <div class="row"><label>晃动速度</label><input type="range" id="speed" min="0.01" max="0.2" step="0.01" value="0.1" oninput="up('speed',this.value)"><span class="val" id="speed-v">0.10</span></div>
        <div class="row"><label>亮度阈值</label><input type="range" id="thresh" min="0" max="200" step="5" value="10" oninput="up('thresh',this.value)"><span class="val" id="thresh-v">10</span></div>
    </div>

    <div class="ctrl">
        <h3>风格</h3>
        <div class="row" style="margin-bottom:8px;">
            <select id="colorMode" onchange="upColorMode(this.value)" style="flex:1;background:rgba(255,255,255,0.08);color:#e8e6dc;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:8px;font-size:13px;">
                <option value="0">🎨 原色</option>
                <option value="1">🔥 暖色调</option>
                <option value="2">❄️ 冷色调</option>
                <option value="3">🖤 黑白</option>
                <option value="4">💜 赛博朋克</option>
                <option value="5">📷 复古胶片</option>
            </select>
        </div>
        <div class="row" style="margin-bottom:8px;">
            <label>背景色</label>
            <input type="color" id="bgColor" value="#1e1e26" onchange="upBg(this.value)" style="width:40px;height:28px;border:none;border-radius:4px;cursor:pointer;background:none;padding:0;">
        </div>
        <div class="row">
            <label>鼠标力度</label>
            <input type="range" id="cForce" min="0" max="3" step="0.1" value="1" oninput="upCF(this.value)">
            <span class="val" id="cForce-v">1</span>
        </div>
    </div>

    <div class="ctrl">
        <h3>操作</h3>
        <div class="btn-row"><button class="btn" onclick="regen()">↻ 重播</button><button class="btn b2" onclick="resetAll()">重置</button></div>
        <button class="btn b3" id="vortexBtn" onclick="toggleVortex()" style="margin-top:6px;">🧲 磁吸模式：关</button>
        <button class="btn b3" onclick="settle()" style="margin-top:6px;">🌧️ 粒子沉降</button>
        <button class="btn b3" onclick="explode()" style="margin-top:6px;">💥 炸开聚合</button>
        <button class="btn b3" onclick="downloadPNG()" style="margin-top:6px;">⬇ 下载 PNG</button>
    </div>
</div>

<div class="canvas-area">
    <div id="canvas-wrap">
        <canvas id="gl-canvas" style="display:none"></canvas>
        <div id="p5-mount"></div>
        <div class="loading" id="loading-msg">请上传一张图片，或等待默认流场生成...</div>
    </div>
</div>
</div>

<script>
// ═══════════════════════════════════ 全局状态 ══════════════════════
let params = { seed:12345, density:6, pSize:2.5, drift:1, speed:0.1, thresh:10 };
const defs = JSON.parse(JSON.stringify(params));
let hasImage = false, storedDataUrl = null, uploadedImg = false;
let frame = 0; const MAX_FR = 600;
let particles = []; let cx, cy;

// ═══════════════════════════════════ p5.js 流场 ═══════════════════
let flowField = [], cols, rows;
const RES = 5;

var _p5 = null;
new p5(function(p) {
    _p5 = p;
    p.setup = function() {
        let c = p.createCanvas(1200, 1200);
        c.parent('p5-mount');
        p.colorMode(p.HSB, 360, 100, 100, 100);
        p.noiseDetail(4, 0.55);
        cx = p.width/2; cy = p.height/2;
        initFlowField();
        document.getElementById('loading-msg').style.display = 'none';
    };

    p.draw = function() {
        if (hasImage) return; // 图片模式不画
        if (!flowField.length) return;
        p.noStroke(); p.fill(6,6,13, 8); p.rect(0,0,p.width,p.height);
        let alive = 0;
        for (let pt of particles) {
            if (!pt.alive) continue; alive++;
            let col = p.constrain(p.floor(pt.x/RES),0,cols-1);
            let row = p.constrain(p.floor(pt.y/RES),0,rows-1);
            let fl = flowField[row][col];
            pt.px=pt.x; pt.py=pt.y; pt.x+=fl.x*1.2; pt.y+=fl.y*1.2;
            let d = p.dist(cx,cy,pt.x,pt.y);
            if (d>pt.md || pt.x<-20 || pt.x>p.width+20 || pt.y<-20 || pt.y>p.height+20) { pt.alive=false; continue; }
            let dr = p.constrain(d/pt.md,0,1);
            let ang = p.atan2(pt.y-cy,pt.x-cx);
            p.stroke(p.map(ang,-p.PI,p.PI,0,360),85,95, 10*(1-dr*0.6));
            p.strokeWeight(p.map(dr,0,1,1.5,0.6));
            p.line(pt.px,pt.py,pt.x,pt.y);
        }
        frame++;
        if (frame>=MAX_FR || (alive===0 && frame>10)) p.noLoop();
    };
});

function initFlowField() {
    hasImage = false;
    document.getElementById('gl-canvas').style.display = 'none';
    document.getElementById('p5-mount').style.display = 'block';
    if (!_p5) return;
    _p5.randomSeed(params.seed); _p5.noiseSeed(params.seed);
    cols = Math.floor(1200/RES); rows = Math.floor(1200/RES);
    flowField = Array(rows);
    for (let y=0; y<rows; y++) {
        flowField[y] = Array(cols);
        for (let x=0; x<cols; x++) {
            flowField[y][x] = p5.Vector.fromAngle(_p5.noise(x*RES*0.003,y*RES*0.003)*_p5.TWO_PI*3+_p5.noise(x*RES*0.003+100,y*RES*0.003+100)*0.8);
        }
    }
    particles = [];
    for (let i=0; i<3500; i++) {
        let a = _p5.random(_p5.TWO_PI), r = _p5.random(0,60);
        particles.push({ x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r, px:cx+Math.cos(a)*r, py:cy+Math.sin(a)*r, md:_p5.random(200,540), sp:_p5.random(0.4,2.2), alive:true, src:'flow' });
    }
    frame=0; _p5.loop();
}

// ═══════════════════════════════════ WebGL 粒子引擎 ═══════════════
let gl = null, glProgram = null, glVBO = null, glCount = 0;
let glBgShader = null, glBgVBO = null, glNoiseTex = null;
let glRAF = null, glTime = 0;
let cursorX = -999, cursorY = -999, cursorActive = 0;
let colorMode = 0, bgColor = [0.12,0.12,0.15], cursorForce = 1;
let explodeVal = 0, explodeRAF = null;
let rippleX = 0, rippleY = 0, rippleR = 0, rippleRAF = null;
let settleVal = 0, settleRAF = null;
let vortexX = 0, vortexY = 0, vortexZ = 0, vortexHolding = false;

const VS = `#version 100
attribute vec2 a_pos; attribute vec3 a_col; attribute float a_phase; attribute float a_bright;
uniform float u_time, u_drift, u_ps, u_w, u_h;
uniform sampler2D u_noise;
uniform vec3 u_cursor;
uniform float u_cursorForce;
uniform float u_explode;
uniform float u_settle;
uniform vec3 u_vortex; // x,y=磁吸中心 z=力度
uniform vec3 u_ripple;
varying vec3 v_col; varying float v_alpha;
void main(){
    float x=a_pos.x,y=a_pos.y;
    if(u_drift>0.0){
        vec2 uv=vec2(x/u_w,y/u_h)+u_time*0.015;
        float nx=texture2D(u_noise, uv).r*2.0-1.0;
        float ny=texture2D(u_noise, uv+vec2(0.43,0.27)).g*2.0-1.0;
        x+=nx*u_drift*3.5;
        y+=ny*u_drift*3.5;
    }
    // 炸开聚合
    if(u_explode>0.0){
        vec2 dir=a_pos-vec2(u_w*0.5,u_h*0.5);
        float len=length(dir);
        if(len>0.0) dir=dir/len;
        float strength=sin(u_explode*3.14159)*350.0;
        x+=dir.x*strength;
        y+=dir.y*strength;
    }
    // 点击波纹
    if(u_ripple.z>0.0){
        float dx=x-u_ripple.x,dy=y-u_ripple.y;
        float dist=sqrt(dx*dx+dy*dy);
        float ring=exp(-abs(dist-u_ripple.z)/50.0);
        if(dist>0.0){x+=dx/dist*ring*35.0;y+=dy/dist*ring*35.0;}
    }
    // 粒子散开弹回（每颗粒子方向不同，错开时序）
    if(u_settle>0.0){
        float delay=fract(a_phase*0.73)*0.25;
        float t=clamp((u_settle-delay)*1.6, 0.0, 1.0);
        float s=sin(t*3.14159);
        float ang=a_phase*6.283;
        x+=cos(ang)*s*70.0;
        y+=sin(ang)*s*70.0;
    }
    // 按住磁吸：粒子螺旋吸入
    if(u_vortex.z>0.0){
        float dx=x-u_vortex.x,dy=y-u_vortex.y;
        float dist=sqrt(dx*dx+dy*dy);
        float r=350.0;
        if(dist<r && dist>0.0){
            float f=u_vortex.z*(1.0-dist/r);
            float ang=atan(dy,dx)+f*2.5;
            float nd=dist*(1.0-f*0.4);
            x=u_vortex.x+cos(ang)*nd;
            y=u_vortex.y+sin(ang)*nd;
        }
    }
    // 鼠标推开粒子
    if(u_cursor.z>0.0){
        float dx=x-u_cursor.x, dy=y-u_cursor.y;
        float dist=sqrt(dx*dx+dy*dy);
        float r=150.0;
        if(dist<r){
            float f=u_cursorForce*(1.0-dist/r);
            x+=dx/dist*f*40.0;
            y+=dy/dist*f*40.0;
        }
    }
    gl_Position=vec4(x/u_w*2.0-1.0,1.0-y/u_h*2.0,0.0,1.0);
    gl_PointSize=u_ps;
    v_col=a_col;
    v_alpha=a_bright;
}`;

const FS = `#version 100
precision mediump float;
varying vec3 v_col; varying float v_alpha;
uniform int u_colorMode;
void main(){
    float d=length(gl_PointCoord-vec2(0.5))*2.0;
    float a=v_alpha*step(d,0.95);
    vec3 c=v_col;
    if(u_colorMode==1){ // 暖色调
        c.r*=1.15; c.g*=0.9; c.b*=0.7;
    }else if(u_colorMode==2){ // 冷色调
        c.r*=0.75; c.g*=0.95; c.b*=1.2;
    }else if(u_colorMode==3){ // 黑白
        float g=(c.r+c.g+c.b)/3.0;
        c=vec3(g);
    }else if(u_colorMode==4){ // 赛博朋克
        float g=(c.r+c.g+c.b)/3.0;
        c=vec3(g*0.8,g*0.3,g)*1.3;
    }else if(u_colorMode==5){ // 复古胶片
        c=vec3(c.r*1.1,c.g*0.85,c.b*0.65);
    }
    gl_FragColor=vec4(c,a);
}`;

function initGL() {
    let cv = document.getElementById('gl-canvas');
    cv.width = 1200; cv.height = 1200;
    gl = cv.getContext('webgl', {alpha:true, premultipliedAlpha:false, preserveDrawingBuffer:true}) ||
         cv.getContext('experimental-webgl', {alpha:true, premultipliedAlpha:false, preserveDrawingBuffer:true});
    if (!gl) { alert('浏览器不支持WebGL'); return; }

    function mkShader(type, src) {
        let s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
        return s;
    }
    // 粒子着色器
    glProgram = gl.createProgram();
    gl.attachShader(glProgram, mkShader(gl.VERTEX_SHADER, VS));
    gl.attachShader(glProgram, mkShader(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(glProgram);
    if (!gl.getProgramParameter(glProgram, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(glProgram));
    glVBO = gl.createBuffer();

    // 背景淡出着色器
    let bgVS = `#version 100
    attribute vec2 a_pos;
    void main(){ gl_Position=vec4(a_pos,0.0,1.0); }`;
    let bgFS = `#version 100
    precision mediump float;
    uniform vec4 u_color;
    void main(){ gl_FragColor=u_color; }`;
    glBgShader = gl.createProgram();
    gl.attachShader(glBgShader, mkShader(gl.VERTEX_SHADER, bgVS));
    gl.attachShader(glBgShader, mkShader(gl.FRAGMENT_SHADER, bgFS));
    gl.linkProgram(glBgShader);
    glBgVBO = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, glBgVBO);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    // 噪声纹理（128×128 随机 + GPU 双线性插值 = 平滑流场）
    let nSize = 128;
    let nData = new Uint8Array(nSize * nSize * 4);
    for (let i = 0; i < nSize * nSize * 4; i++) nData[i] = Math.floor(Math.random() * 256);
    glNoiseTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, glNoiseTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, nSize, nSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, nData);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
}

function uploadGL(arr) {
    let buf = new Float32Array(arr.length * 7);
    let th = params.thresh;
    for (let i=0; i<arr.length; i++) {
        let p = arr[i], j = i*7;
        buf[j]=p.ox; buf[j+1]=p.oy;
        buf[j+2]=p.r/255; buf[j+3]=p.g/255; buf[j+4]=p.b/255;
        buf[j+5]=p.ph||Math.random()*6.283;
        // 亮度 → alpha：暗部 0.3，亮部 1.0
        buf[j+6]=0.3 + ((p.bright||128)/255) * 0.7;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, glVBO);
    gl.bufferData(gl.ARRAY_BUFFER, buf, gl.STATIC_DRAW);
    glCount = arr.length;
}

function drawGL(time, driftOverride) {
    gl.viewport(0, 0, 1200, 1200);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(glProgram);
    let d = driftOverride !== undefined ? driftOverride : params.drift;
    gl.uniform1f(gl.getUniformLocation(glProgram,'u_time'), time);
    gl.uniform1f(gl.getUniformLocation(glProgram,'u_drift'), d);
    gl.uniform1f(gl.getUniformLocation(glProgram,'u_ps'), params.pSize);
    gl.uniform1f(gl.getUniformLocation(glProgram,'u_w'), 1200);
    gl.uniform1f(gl.getUniformLocation(glProgram,'u_h'), 1200);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, glNoiseTex);
    gl.uniform1i(gl.getUniformLocation(glProgram,'u_noise'), 0);
    gl.uniform3f(gl.getUniformLocation(glProgram,'u_cursor'), cursorX, cursorY, cursorActive);
    gl.uniform1f(gl.getUniformLocation(glProgram,'u_cursorForce'), cursorForce);
    gl.uniform1i(gl.getUniformLocation(glProgram,'u_colorMode'), colorMode);
    gl.uniform1f(gl.getUniformLocation(glProgram,'u_explode'), explodeVal);
    gl.uniform1f(gl.getUniformLocation(glProgram,'u_settle'), settleVal);
    gl.uniform3f(gl.getUniformLocation(glProgram,'u_vortex'), vortexX, vortexY, vortexZ);
    gl.uniform3f(gl.getUniformLocation(glProgram,'u_ripple'), rippleX, rippleY, rippleR);

    let stride = 7*4;
    let bind = function(name, size, off) {
        let loc = gl.getAttribLocation(glProgram, name);
        gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, off);
    };
    bind('a_pos', 2, 0); bind('a_col', 3, 8); bind('a_phase', 1, 20); bind('a_bright', 1, 24);
    gl.drawArrays(gl.POINTS, 0, glCount);
}

function glRenderLoop() {
    if (!hasImage || glCount===0) { glRAF = requestAnimationFrame(glRenderLoop); return; }
    if (params.drift > 0) glTime += 0.04 * params.speed * 2;

    gl.clearColor(bgColor[0], bgColor[1], bgColor[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    drawGL(glTime);
    frame++;
    if (params.drift === 0 && frame > 1) { glRAF = null; return; }
    glRAF = requestAnimationFrame(glRenderLoop);
}

function startGLoop() {
    if (glRAF) cancelAnimationFrame(glRAF);
    glTime = 0;
    glRAF = requestAnimationFrame(glRenderLoop);
}

// ═══════════════════════════════════ 图片处理 ═══════════════════
function processImage() {
    if (!storedDataUrl) { initFlowField(); return; }
    let imgEl = new Image();
    imgEl.src = storedDataUrl;
    if (!imgEl.complete || imgEl.naturalWidth===0) { imgEl.onload=()=>processImageCore(imgEl); return; }
    processImageCore(imgEl);
}

function processImageCore(imgEl) {
    // 用确定性随机（基于种子）
    let s = params.seed;
    function seededRand() { s=(s*16807+0)%2147483647; return s/2147483647; }
    let iw=imgEl.naturalWidth||imgEl.width, ih=imgEl.naturalHeight||imgEl.height;
    let scale = Math.max(1200/iw, 1200/ih);
    let sw=Math.floor(iw*scale), sh=Math.floor(ih*scale);
    let ox=(1200-sw)/2, oy=(1200-sh)/2;

    let c=document.createElement('canvas'); c.width=sw; c.height=sh;
    let ctx=c.getContext('2d'); ctx.drawImage(imgEl,0,0,sw,sh);
    let data=ctx.getImageData(0,0,sw,sh).data;

    let step=Math.max(2, Math.floor(16-params.density*1.4));
    particles=[];

    for (let y=0; y<sh; y+=step) {
        for (let x=0; x<sw; x+=step) {
            let idx=(y*sw+x)*4;
            let rr=data[idx], gg=data[idx+1], bb=data[idx+2], aa=data[idx+3];
            let bright=(rr+gg+bb)/3;
            if (bright>=params.thresh && aa>20) {
                let px=ox+x, py=oy+y;
                if (px<0||px>=1200||py<0||py>=1200) continue;
                let count=bright>200?3:bright>140?2:1;
                for (let n=0; n<count; n++) {
                    particles.push({ox:px+(seededRand()-0.5)*step, oy:py+(seededRand()-0.5)*step, r:rr, g:gg, b:bb, bright:bright, ph:seededRand()*6.283});
                }
            }
        }
    }

    // 切到 WebGL 画布
    hasImage = true;
    document.getElementById('p5-mount').style.display = 'none';
    document.getElementById('gl-canvas').style.display = 'block';

    if (!gl) initGL();
    uploadGL(particles);
    frame=0; startGLoop();
}

// ═══════════════════════════════ UI ═════════════════════════
function up(k, v) {
    params[k] = (k==='density') ? parseInt(v) : parseFloat(v);
    document.getElementById(k+'-v').textContent = v;
    if (uploadedImg) processImage(); else initFlowField();
}
function handleFile(file) {
    if (!file) return;
    let reader = new FileReader();
    reader.onload = function(e) {
        storedDataUrl = e.target.result; uploadedImg = true;
        document.getElementById('preview').src = e.target.result;
        document.getElementById('preview').style.display = 'block';
        document.getElementById('hint').style.display = 'none';
        document.getElementById('dropZone').classList.add('has-img');
        processImage();
    };
    reader.readAsDataURL(file);
}
function clearImage() {
    uploadedImg = false; storedDataUrl = null;
    document.getElementById('preview').style.display = 'none';
    document.getElementById('hint').style.display = '';
    document.getElementById('dropZone').classList.remove('has-img');
    document.getElementById('fileIn').value = '';
    initFlowField();
}
function triggerRipple(cx, cy) {
    if (!hasImage) return;
    if (rippleRAF) cancelAnimationFrame(rippleRAF);
    rippleX = cx; rippleY = cy; rippleR = 0;
    let start = performance.now();
    function anim(now) {
        let t = (now - start) / 1000; // 1 秒
        if (t >= 1) { rippleR = 0; rippleRAF = null; return; }
        rippleR = t * 700; // 半径从 0 扩展到 700px
        rippleRAF = requestAnimationFrame(anim);
    }
    rippleRAF = requestAnimationFrame(anim);
}

function toggleVortex() {
    vortexHolding = !vortexHolding;
    let btn = document.getElementById('vortexBtn');
    btn.textContent = vortexHolding ? '🧲 磁吸模式：开' : '🧲 磁吸模式：关';
    if (!vortexHolding) vortexZ = 0;
}
function settle() {
    if (!hasImage) return;
    if (settleRAF) cancelAnimationFrame(settleRAF);
    let start = performance.now();
    function anim(now) {
        let t = (now - start) / 2000; // 2 秒
        if (t >= 1) { settleVal = 0; settleRAF = null; return; }
        settleVal = t;
        settleRAF = requestAnimationFrame(anim);
    }
    settleRAF = requestAnimationFrame(anim);
}

function explode() {
    if (!hasImage) return;
    if (explodeRAF) cancelAnimationFrame(explodeRAF);
    let start = performance.now();
    function anim(now) {
        let t = (now - start) / 2000; // 2 秒完成
        if (t >= 1) { explodeVal = 0; explodeRAF = null; return; }
        explodeVal = t;
        explodeRAF = requestAnimationFrame(anim);
    }
    explodeRAF = requestAnimationFrame(anim);
}
function regen() { if (uploadedImg) processImage(); else initFlowField(); }
function resetAll() {
    params = JSON.parse(JSON.stringify(defs));
    ['density','pSize','drift','speed','thresh'].forEach(k=>{
        document.getElementById(k).value=params[k]; document.getElementById(k+'-v').textContent=params[k];
    });
    updateSeedDisp();
    if (uploadedImg) processImage(); else initFlowField();
}
function downloadPNG() {
    let cv = document.getElementById('gl-canvas');
    if (hasImage && cv.style.display!=='none') {
        // 强制渲染一帧
        gl.clearColor(bgColor[0], bgColor[1], bgColor[2], 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        drawGL(glTime);

        // gl.readPixels 读显存 → 2D canvas → 下载（稳定可靠）
        let w = 1200, h = 1200;
        let pixels = new Uint8Array(w * h * 4);
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

        // 写入 2D canvas（翻转 Y，WebGL 原点在左下）
        let c2 = document.createElement('canvas');
        c2.width = w; c2.height = h;
        let ctx = c2.getContext('2d');
        let img = ctx.createImageData(w, h);
        for (let y = 0; y < h; y++) {
            let srcRow = (h - 1 - y) * w * 4;
            let dstRow = y * w * 4;
            for (let x = 0; x < w * 4; x++) {
                img.data[dstRow + x] = pixels[srcRow + x];
            }
        }
        ctx.putImageData(img, 0, 0);

        let a = document.createElement('a');
        a.download = 'particle-art-'+params.seed+'.png';
        a.href = c2.toDataURL('image/png');
        a.click();
    } else {
        if (_p5) _p5.saveCanvas('particle-art-'+params.seed, 'png');
    }
}

function upColorMode(v) { colorMode = parseInt(v); }
function upBg(hex) {
    let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
    bgColor=[r,g,b];
}
function upCF(v) { cursorForce=parseFloat(v); document.getElementById('cForce-v').textContent=v; }

// 鼠标追踪
let glCanvasEl = document.getElementById('gl-canvas');
glCanvasEl.addEventListener('mousemove', function(e) {
    let rect = glCanvasEl.getBoundingClientRect();
    let scaleX = 1200 / rect.width;
    let scaleY = 1200 / rect.height;
    cursorX = (e.clientX - rect.left) * scaleX;
    cursorY = (e.clientY - rect.top) * scaleY;
    cursorActive = 1;
});
glCanvasEl.addEventListener('mouseleave', function() { cursorActive = 0; });
glCanvasEl.addEventListener('touchmove', function(e) {
    e.preventDefault();
    let rect = glCanvasEl.getBoundingClientRect();
    cursorX = (e.touches[0].clientX - rect.left) * (1200/rect.width);
    cursorY = (e.touches[0].clientY - rect.top) * (1200/rect.height);
    cursorActive = 1;
}, {passive:false});
glCanvasEl.addEventListener('touchend', function() { cursorActive = 0; });
glCanvasEl.addEventListener('mousedown', function(e) {
    if (!vortexHolding) return;
    let rect = glCanvasEl.getBoundingClientRect();
    vortexX = (e.clientX - rect.left) * (1200/rect.width);
    vortexY = (e.clientY - rect.top) * (1200/rect.height);
    vortexZ = 1;
});
glCanvasEl.addEventListener('mouseup', function() { if (vortexHolding) vortexZ = 0; });
glCanvasEl.addEventListener('mousemove', function(e) {
    if (!vortexHolding || vortexZ === 0) return;
    let rect = glCanvasEl.getBoundingClientRect();
    vortexX = (e.clientX - rect.left) * (1200/rect.width);
    vortexY = (e.clientY - rect.top) * (1200/rect.height);
});
glCanvasEl.addEventListener('click', function(e) {
    let rect = glCanvasEl.getBoundingClientRect();
    let cx = (e.clientX - rect.left) * (1200/rect.width);
    let cy = (e.clientY - rect.top) * (1200/rect.height);
    triggerRipple(cx, cy);
});

function updateSeedDisp() { document.getElementById('seedIn').value = params.seed; }
function updateSeed() { let v=parseInt(document.getElementById('seedIn').value); if(v&&v>0){params.seed=v;regen();}else updateSeedDisp(); }
function prevSeed() { params.seed=Math.max(1,params.seed-1); updateSeedDisp(); regen(); }
function nextSeed() { params.seed++; updateSeedDisp(); regen(); }
function randSeed() { params.seed=Math.floor(Math.random()*999999)+1; updateSeedDisp(); regen(); }
window.addEventListener('load',()=>updateSeedDisp());

// 拖拽
document.addEventListener('DOMContentLoaded',()=>{
    let dz = document.getElementById('dropZone');
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderColor='var(--orange)';});
    dz.addEventListener('dragleave',()=>dz.style.borderColor='');
    dz.addEventListener('drop',e=>{
        e.preventDefault(); dz.style.borderColor='';
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
});
</script>
